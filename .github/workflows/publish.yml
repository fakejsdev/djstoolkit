name: Publish to npm

on:
  workflow_run:
    workflows: ["Test & Lint"]
    branches: [main]
    types:
      - completed

jobs:
  publish:
    name: Publish to npm
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node (npm CLI dla OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build
        working-directory: packages/create-djstoolkit

      - name: Publish to npm
        run: npm publish --access public
        working-directory: packages/create-djstoolkit