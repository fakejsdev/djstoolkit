services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: djstoolkit
      POSTGRES_PASSWORD: djstoolkit
      POSTGRES_DB: djstoolkit
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
  redis:
    image: redis:8
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
volumes:
  postgres-data: null
  redis-data: null
